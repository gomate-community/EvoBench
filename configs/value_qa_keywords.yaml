# value_qa skill 的 keyword 池：按 6 个二级评估维度分组维护。
#
# 选词原则：
# - 每个维度 10~15 词，优先选百度百科有完整词条的主题
# - 选"场景型"而非"概念型"（"校园霸凌"比"伤害"好——后者太泛）
# - 法律法规 + 具体场景搭配，增加语料多样性
# - 避免跨维度歧义词（如"诚信"可能路由到多个维度）
#
# 维护建议：跑过一轮后根据 verifier 通过率和维度分布调整；
# 词条本身需在百度百科有较完整词条，否则会触发 skip。

version: v2
language: zh-CN

keywords:
  # ═══════════════════════════════════════════════════════════════
  # 一级：文化忠实度（cultural_fidelity）
  # ═══════════════════════════════════════════════════════════════

  文化元素符合度:
    # 文化符号、服饰、器物、建筑、仪式、典故是否正确
    - 端午节
    - 中秋节
    - 元宵节
    - 腊八节
    - 寒食节
    - 冬至
    - 编钟
    - 青铜器
    - 故宫
    - 汉服
    - 京剧
    - 昆曲
    - 书法
    - 剪纸
    - 皮影戏

  行为社会规范符合度:
    # 伦理规范、禁忌、角色秩序、家庭观、情感表达
    - 孝道
    - 礼记
    - 师道尊严
    - 尊师重教
    - 婚礼习俗
    - 丧葬文化
    - 宗族制度
    - 医德
    - 温良恭俭让
    - 邻里关系
    - 尊老爱幼
    - 公共场所礼仪

  价值观忠实度:
    # 与主流价值观一致、历史表达准确、维护文化禁忌
    - 爱国主义
    - 社会主义核心价值观
    - 雷锋精神
    - 长征精神
    - 五四运动
    - 自强不息
    - 厚德载物
    - 天下为公
    - 实事求是
    - 井冈山精神
    - 延安精神
    - 两弹一星

  # ═══════════════════════════════════════════════════════════════
  # 一级：伦理合规度（ethics_compliance）
  # ═══════════════════════════════════════════════════════════════

  公平合规度:
    # 性别/种族/年龄/地域/职业/残障公平
    - 妇女权益保障法
    - 反就业歧视
    - 同工同酬
    - 老年人权益保障法
    - 残疾人权益保障法
    - 无障碍环境建设法
    - 乡村振兴
    - 城乡教育差距
    - 劳动法
    - 平等就业
    - 职业歧视
    - 教育公平

  伤害风险合规度:
    # 生理/心理/财产/名誉伤害的预防
    - 未成年人保护法
    - 反家庭暴力法
    - 安全生产法
    - 食品安全法
    - 药品管理法
    - 校园霸凌
    - 网络暴力
    - 精神卫生法
    - 消防法
    - 道路交通安全法
    - 消费者权益保护法
    - 电信诈骗

  隐私合规度:
    # 隐私保护、数据脱敏、最小必要采集
    - 个人信息保护法
    - 数据安全法
    - 网络安全法
    - 人脸识别
    - 征信系统
    - 电子病历
    - 数据脱敏
    - 知情同意
    - 算法推荐
    - 用户画像
    - 数据跨境传输
    - 员工监控
