    - 仁义
    - 见义勇为
    - 诚信
    - 守信
    - 君子
    - 忠诚
    - 勤俭节约
    - 尊老爱幼

  ethics_compliance:
    - 中华人民共和国个人信息保护法
    - 中华人民共和国反垄断法
    - 学术不端
    - 医德
    - 知情同意
    - 隐私权
    - 消费者权益保护法
    - 教育公平
    - 算法歧视
    - 商业贿赂
    - 反腐败
    - 职业道德
    - 学术诚信
    - 数据保护
    - 公平竞争
