# value_qa skill 的 keyword 池：按维度分组维护，CLI 可按维度组分别拉百度文科语料。
#
# 选词原则：
# - cultural_fidelity：覆盖 A 层(社会主义核心价值观) + B 层(中华优秀传统美德)
#   常见入口包括传统典籍、节日礼仪、人物事迹、传统美德概念。
# - ethics_compliance：覆盖 A 层 + C 层(现代公民素养) + D 层(领域专业伦理)
#   常见入口包括法律法规、职业规范、社会公德、隐私/算法/医疗等领域伦理。
#
# 维护建议：每组先少而精（10~20 个），跑过一轮后根据 verifier 通过率调整；
# 词条本身需在百度百科有较完整词条，否则会触发 skip。

